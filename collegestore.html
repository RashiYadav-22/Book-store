<html>
<head>
    <title>COLLEGE BOOKSTORE</title>
    <style>
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        td {
            border: 2px solid black;
            text-align: center;
        }

        .logo-bg {
            background-color: #f9cb9c;
            width: 20%;
            font-weight: bold;
        }

        .header-bg {
            background-color: #fce5cd;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-bg {
            background-color: #fff2cc;
            height: 40px;
        }

        .nav-bg a {
            margin: 0 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .left-menu {
            width: 20%;
            vertical-align: top;
            text-align: left;
            padding: 15px;
        }

        .left-menu a {
            display: block;
            margin-bottom: 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .right-content {
            vertical-align: top;
            text-align: left;
            padding: 20px;
        }
    </style>
</head>
<body>


    <table>
        <!-- Row 1: Logo and College Name -->
        <tr height="60">
            <td class="logo-bg">Logo</td>
            <td class="header-bg">GL BAJAJ INSTUTION OF TECHNOLOGY</td>
        </tr>

        <!-- Row 2: Top Navigation Links -->
        <tr class="nav-bg">
            <td colspan="2">
                <a href="#">Home</a>
                <a href="#">Login</a>
                <a href="#">Registration</a>
                <a href="#">Catalogue</a>
                <a href="#">Cart</a>
            </td>
        </tr>

        <!-- Row 3: Left Links & Right Content -->
        <tr>
            <!-- Left Frame: Department Links -->
            <td class="left-menu">
                <a href="#">CSE</a>
                <a href="#">ECE</a>
                <a href="#">EEE</a>
                <a href="#">CIVIL</a>
            </td>

            <!-- Right Frame: Description Area -->
            <td class="right-content">
                <h2>Description of the WebSite</h2>
                <p>Welcome to the COLLEGE BOOKSTORE . Select a department from the left menu to view the required textbooks and references.</p>
            </td>
        </tr>
    </table>

</body>
</html>
